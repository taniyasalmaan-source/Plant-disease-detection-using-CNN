<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183c2b">
  <title>{% block title %}RoseGuard{% endblock %} · RoseGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light site-nav">
    <div class="container">
      <a class="navbar-brand brand" href="{{ url_for('home') }}"><span class="brand-mark">✿</span> RoseGuard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="siteNav">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <a class="nav-link" href="{{ url_for('home') }}">Home</a>
          <a class="nav-link" href="{{ url_for('detect') }}">Detection</a>
          <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="nav-link" href="{{ url_for('history') }}">History</a>
          <a class="nav-link" href="{{ url_for('about') }}">About</a>
          <a class="btn btn-primary-green nav-cta" href="{{ url_for('detect') }}">Check a leaf <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand footer-brand" href="{{ url_for('home') }}"><span class="brand-mark">✿</span> RoseGuard</a>
      <p>Thoughtful tools for healthier roses.</p>
      <span class="footer-note">AI guidance is a screening aid, not a substitute for expert diagnosis.</span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
